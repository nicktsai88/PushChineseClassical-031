                text: "你「衣冠而之市」，穿得整整齊齊來到熱鬧的市集。人群熙熙攘攘，你看到了一個賣金子的攤位。",
                imageData: "images/rpg_market.jpg",
                choices: [
                    { text: "走過去看看", next: "stall" },
                    { text: "太貴了，還是回家吧", next: "go_home" }
                ]
            },
            go_home: {
                id: 'go_home',
                text: "你克制住了慾望，決定回家腳踏實地工作。雖然沒有金子，但你擁有平安。",
                choices: [{ text: "重來", next: "start" }],
                isEnding: true,
                win: true
            },
            stall: {
                id: 'stall',
                text: "你站在金子攤位前，看著那閃閃發光的金子，心跳加速。你的眼裡似乎只剩下金子了...",
                imageData: "images/rpg_stall.jpg",
                choices: [
                    { text: "不管了，伸手就抓！(攫其金)", next: "grab" },
                    { text: "冷靜下來，看看周圍", next: "calm_down" }
                ]
            },
            calm_down: {
                id: 'calm_down',
                text: "你深吸一口氣，發現周圍都是人，還有官差在巡邏。你意識到搶劫是愚蠢的，於是轉身離開。",
                imageData: "images/rpg_calm_down.jpg",
                choices: [{ text: "重新體驗", next: "start" }],
                isEnding: true,
                win: true
            },
            grab: {
                id: 'grab',
                text: "你「因攫其金而去」，抓了金子轉身就跑！但沒跑幾步，就被一群人圍住，官差立刻把你抓了起來。",
                imageData: "images/rpg_grab.jpg",
                choices: [
                    { text: "束手就擒", next: "captured" }
                ]
            },
            captured: {
                id: 'captured',
                text: "官差問你：「人皆在焉，子攫人之金何？」（大家都看著，你為什麼敢搶？）你該怎麼回答？",
                imageData: "images/rpg_captured.jpg",
                choices: [
                    { text: "我只看見金子，沒看見人 (徒見金)", next: "bad_end" },
                    { text: "我...我一時糊塗", next: "regret" }
                ]
            },
            regret: {
                id: 'regret',
                text: "【Normal Ending: 悔不當初】你痛哭流涕，承認錯誤。雖然免不了刑罰，但至少你找回了理智。",
                imageData: "images/rpg_regret.jpg",
                choices: [{ text: "重來", next: "start" }],
                isEnding: true
            },
            bad_end: {
                id: 'bad_end',
                text: "【True Ending: 利令智昏】你說出了千古名言：「取金之時，不見人，徒見金。」你的故事被列子記錄下來，成為後世嘲笑的對象。",
                imageData: "images/rpg_bad_end.jpg",
                choices: [{ text: "重新體驗", next: "start" }],
                isEnding: true
            }
        };

        function renderStory(container) {
            if(!window.currentStoryNode) window.currentStoryNode = 'start';
            const node = storyNodes[window.currentStoryNode];

            let imageContent = `<div class="w-full overflow-hidden rounded-t-xl"><img src="${node.imageData}" class="w-full h-auto fade-in-image" alt="場景圖" onerror="this.style.display='none'"></div>`;
            
            container.innerHTML = `<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden border border-amber-100">${imageContent}<div class="p-8"><div class="flex items-center mb-4 text-amber-800 text-sm font-bold uppercase tracking-widest"><i class="fas fa-scroll mr-2"></i> 抉擇時刻</div><p class="text-xl leading-relaxed text-gray-800 mb-8 font-serif">${node.text}</p>${node.isEnding ? (node.win ? `<div class="text-center mb-6 text-green-600 font-bold text-2xl p-4 bg-green-50 rounded-lg border border-green-200"><i class="fas fa-trophy mr-2"></i>懸崖勒馬！</div>` : `<div class="text-center mb-6 text-red-600 font-bold text-2xl p-4 bg-red-50 rounded-lg border border-red-200"><i class="fas fa-skull-crossbones mr-2"></i>利令智昏</div>`) : ''}<div class="grid gap-4">${node.choices.map(c => `<button onclick="nextStoryNode('${c.next}')" class="story-choice w-full py-4 px-6 bg-white hover:bg-amber-50 border-2 border-amber-200 hover:border-amber-400 rounded-xl text-amber-900 font-bold text-lg transition duration-200 flex items-center justify-between group"><span>${c.text}</span><i class="fas fa-chevron-right text-amber-300 group-hover:text-amber-600 transition"></i></button>`).join('')}</div></div></div>`;
            if(node.win) { 
                try {
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                } catch(e) {
                    console.log("Confetti effect skipped");
                }
            }
        }

        function nextStoryNode(nodeId) {
            window.currentStoryNode = nodeId;
            renderStory(document.getElementById('content-display'));
        }

        function checkAnswer(idx, val, ans) {
            if (userAnswers[idx] !== undefined) return; 

            userAnswers[idx] = val; 
            
            const radios = document.getElementsByName(`q-${idx}`);
            for (let radio of radios) {
                radio.disabled = true;
                radio.parentElement.classList.add('disabled-label');
            }

            const feedbackEl = document.getElementById(`feedback-${idx}`);
            const card = document.getElementById(`quiz-card-${idx}`);
            const qData = contentData.quiz[idx];
            if (!feedbackEl || !card) return;
            
            feedbackEl.className = 'mt-4 p-3 rounded-lg text-lg animate-fade-in';
            card.classList.remove('border-green-500', 'border-red-500');

            if (val === ans) {
                feedbackEl.innerHTML = `<strong class="block mb-1"><i class="fas fa-check-circle mr-1"></i>答對了！</strong>${qData.exp}`;
                feedbackEl.classList.add('bg-green-50', 'text-green-800');
                card.classList.add('border-green-500');
            } else {
                feedbackEl.innerHTML = `<strong class="block mb-1"><i class="fas fa-times-circle mr-1"></i>再想一下...</strong>提示：${qData.exp.substring(0, 15)}...`;
                feedbackEl.classList.add('bg-red-50', 'text-red-800');
                card.classList.add('border-red-500');
            }
            // Ensure visible
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-amber-600 font-bold text-4xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                confetti({
                    particleCount: 200,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }
        
        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) {
                e.stopPropagation();
            }

            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            
            let noteData = null;
            
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) {
                noteData = contentData.segments[segIdx].notes[key];
            } else if (allKeywords[key]) {
                noteData = allKeywords[key];
            }

            if(!noteData) return;

            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-gray-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-amber-800">${key}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-gray-500 mb-1 font-mono">${noteData.zhuyin}</p>
                <p class="text-gray-700 leading-relaxed">${noteData.def || noteData.meaning}</p>
            `;

            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 5; 

            if (left + 260 > document.body.clientWidth) { 
                left = document.body.clientWidth - 270;
            }

            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            
            popup.classList.remove('hidden');
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW') && (v.name.includes('Google') || v.name.includes('Hanhan') || v.name.includes('Mei-Jia') || v.name.includes('Yating')));
            if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); }
            if (!targetVoice) { targetVoice = voices.find(v => v.lang.startsWith('zh')); }
            if (targetVoice) { utterance.voice = targetVoice; }
            utterance.onerror = (e) => { console.error("Speech synthesis error:", e); showError("語音播放發生錯誤，可能是瀏覽器限制或網路問題。"); };
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

    </script>
</body>
